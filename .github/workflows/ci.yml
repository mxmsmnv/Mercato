name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, filter, hash, json, session
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer validate --strict --no-check-publish
      - run: composer verify:runtime
      - run: composer test:unit
      - run: find . -path './vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer check:security
      - run: composer check:licenses
      - run: composer licenses --format=json > licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: licenses.json
  acceptance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: php scripts/validate-acceptance.php
      - run: npx playwright test -c tests/e2e/playwright.config.js --list
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: scripts/build-release.sh 0.0.0-ci
      - run: unzip -l dist/mercato-0.0.0-ci.zip | tee /tmp/release-files.txt
      - run: '! grep -E "(^|/)(tests|\.git|\.github|\.mercato-local|\.env|\.DS_Store)(/|$)" /tmp/release-files.txt'
